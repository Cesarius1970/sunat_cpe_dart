name: sunat_cpe_workspace
description: Monorepo for Peruvian Electronic Invoicing (SUNAT CPE) core, direct SOL adapter, and OSE/PSE adapters in pure Dart.
repository: https://github.com/Cesarius1970/sunat_cpe_dart
publish_to: none

environment:
  sdk: ">=3.13.5 <4.0.0"

workspace:
  - packages/sunat_cpe_core
  - packages/sunat_cpe_nubefact
  - packages/sunat_cpe_efact
  - packages/sunat_cpe_mifact
  - packages/sunat_cpe_bizlinks
  - packages/sunat_cpe_digiflow
  - packages/sunat_cpe_sovos
  - packages/sunat_cpe_facturaloperu
  - packages/sunat_cpe_tci
  - packages/sunat_cpe_cavali
  - packages/sunat_cpe_direct
  - packages/sunat_cpe_dart

dev_dependencies:
  melos: ^8.9.0
  lints: ^6.0.0
  test: ^1.25.0

melos:
  scripts:
    analyze:
      exec: dart analyze .
    test:
      exec: dart test
